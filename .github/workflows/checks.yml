name: Method checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/tensor_readout.py
      - run: python tests/smoke_hf.py
      - run: python code/exact.py --help && python code/sketch.py --help && python examples/read_columns.py --help
