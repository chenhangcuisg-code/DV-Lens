<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DV-Lens in Motion</title>
<meta name="description" content="2:48 introduction · silent film with English captions · DV-Lens: Revealing the Functional Organization of Language Model Parameters">
<meta property="og:title" content="DV-Lens in Motion">
<meta property="og:image" content="assets/video/dvlens_promo_poster.jpg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0d10; color: #e8eaed; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 1100px; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: block; }
  h1 { font-size: 20px; font-weight: 600; margin: 16px 0 2px; }
  p { margin: 0; color: #9aa0a6; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  a { color: #e8eaed; text-decoration: none; border: 1px solid #2c3036; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  a:hover { border-color: #8ab4f8; color: #8ab4f8; }
  #sound { display: none; position: relative; margin-top: 10px; background: #8ab4f8; color: #0b0d10; border: 0; border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <video id="v" src="assets/video/dvlens_promo_1080p.mp4" poster="assets/video/dvlens_promo_poster.jpg" controls playsinline preload="auto"></video>
  <button id="sound" type="button">🔊 Turn sound on</button>
  <h1>DV-Lens in Motion</h1>
  <p>2:48 introduction · silent film with English captions · DV-Lens: Revealing the Functional Organization of Language Model Parameters</p>
  <div class="links"><a href="https://arxiv.org/abs/2610.04489">Paper</a><a href="https://github.com/chenhangcuisg-code/DV-Lens">Code</a><a href="assets/video/dvlens_promo_720p.mp4">720p MP4</a><a href="https://github.com/chenhangcuisg-code/DV-Lens/blob/main/docs/VIDEO.md">Chapters</a></div>
</main>
<script>
  // Try to start right away. Browsers block autoplay with sound, so fall back to muted autoplay
  // and show a button to turn the sound on.
  const v = document.getElementById("v"), s = document.getElementById("sound");
  v.play().catch(() => {
    v.muted = true;
    v.play().then(() => { if (false) s.style.display = "inline-block"; }).catch(() => {});
  });
  s.onclick = () => { v.muted = false; v.play(); s.style.display = "none"; };
  v.addEventListener("volumechange", () => { if (!v.muted) s.style.display = "none"; });
</script>
</body>
</html>
